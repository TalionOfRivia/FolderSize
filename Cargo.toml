[package]
name = "foldersize"
version = "0.1.0"
description = "Free, fast disk space analyzer for Windows: see which folders take up your drive."
license = "MIT"
edition = "2024"

[dependencies]
eframe = "0.36.2"
egui_extras = "0.36.2"
rayon = "1.12.0"
rfd = "0.17.2"
trash = "5.2.9"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.34"

